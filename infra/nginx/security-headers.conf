# Security headers for the sevillasinluz.es SITE (Angular SPA), server-block context.
#
# Include inside the HTTPS `server { }` block for sevillasinluz.es / www.sevillasinluz.es,
# AFTER the `listen 443 ssl;` and cert directives. Do NOT reuse this file for the
# api.sevillasinluz.es server block — use security-headers-api.conf there instead
# (different CSP, no frame embeds needed).
#
# Install:
#   sudo cp infra/nginx/security-headers.conf /etc/nginx/snippets/security-headers.conf
#   # then add inside the site's server{} block:  include snippets/security-headers.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -sI https://sevillasinluz.es/ | grep -iE 'strict-transport|x-content-type|x-frame|referrer-policy|permissions-policy|content-security-policy'
#
# Rollback:
#   remove the `include snippets/security-headers.conf;` line from the server block,
#   sudo nginx -t && sudo systemctl reload nginx

# HSTS: 1 year, apply to subdomains (api.sevillasinluz.es included). `preload` is
# intentionally NOT set here: preload submission is a one-way door (very hard to
# reverse once accepted by browsers). Add `; preload` only after you are fully
# confident in HTTPS on every current and future subdomain, then submit to
# https://hstspreload.org/ separately.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;

# The site is never meant to be framed by another origin.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable powerful browser features this SPA does not use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;

add_header X-XSS-Protection "0" always; # deprecated header, explicitly disabled to avoid legacy filter quirks; CSP is the real protection

# --- Content-Security-Policy ---------------------------------------------
# Built from inspecting frontend/src (index.html, environment.prod.ts, all
# feature components) on 2026-09-28:
#   - connect-src: the Angular app calls only https://api.sevillasinluz.es/api (environment.prod.ts).
#   - frame-src: testimonials/video-card embeds YouTube (youtube.com / youtube-nocookie.com)
#     via <iframe [src]>; Instagram testimonials render a plain outbound <a> link
#     (no Instagram iframe embed exists in the current code), but instagram.com is
#     allow-listed here in case an iframe embed is added later without a CSP change.
#   - img-src: 'self' + data: covers the local assets (favicon.svg, og-image.jpg,
#     inline SVG icons, hero.component.html background-image url('alcalde-micro.webp')).
#     https://tile.openstreetmap.org is also allowed: the /mapa page (Leaflet) loads
#     OpenStreetMap raster tiles from it. No other external image hosts are used.
#   - style-src: 'unsafe-inline' is REQUIRED. hero.component.html uses static
#     style="..." attributes, and Angular's runtime inserts per-component <style>
#     tags into <head> for view-encapsulated component styles (this happens via
#     DOM APIs, not static HTML, but CSP style-src still governs it). Angular does
#     support a nonce-based alternative (ngCspNonce + APP_ID), but that requires a
#     dynamic per-request nonce from a server-rendered template; this is a static
#     SPA served by nginx with no per-request templating, so nonces are not
#     practical here. Accepted trade-off: style injection is inherently less
#     dangerous than script injection (no code execution), so this stays reasonable
#     while script-src remains strict.
#   - script-src: 'self' ONLY. Angular's default production build normally inlines
#     an async-CSS-loading trick (<link media="print" onload="this.media='all'">)
#     when critical-CSS inlining is enabled, which needs 'unsafe-inline'/'unsafe-hashes'
#     for script-src. This repo disables that (frontend/angular.json ->
#     configurations.production.optimization.styles.inlineCritical: false), verified
#     by building and grepping dist/frontend/browser/index.html for `onload=`/`<style>`/
#     `<script>` (only one clean `<script src="main-*.js" type="module">` remains).
#     Keep 'self' strict; do not add 'unsafe-inline' to script-src.
#   - No Google Fonts / external font host is used (no <link> to fonts.googleapis.com
#     found), so no additional font-src entry is needed beyond default-src 'self'.
#
# Recommended rollout: deploy as Content-Security-Policy-Report-Only first (below,
# commented alternative), watch the browser console / a report-uri for a few days
# on real traffic, THEN switch to the enforcing header.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.sevillasinluz.es; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.instagram.com; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

# To test first without breaking anything, comment the line above and uncomment this one:
# add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https://api.sevillasinluz.es; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.instagram.com; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

server_tokens off;
