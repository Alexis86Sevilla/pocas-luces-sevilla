# Rate limiting zones for sevillasinluz.es / api.sevillasinluz.es
#
# This file is an http-context include: it MUST be included inside the
# top-level `http { ... }` block (e.g. from /etc/nginx/nginx.conf), NOT inside
# a `server { ... }` block. `limit_req_zone` / `limit_conn_zone` directives
# are only valid at http level.
#
# Install:
#   sudo cp infra/nginx/rate-limit.conf /etc/nginx/conf.d/rate-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   sudo nginx -T | grep -A2 limit_req_zone
#   for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code}\n" https://api.sevillasinluz.es/api/outages/live; done
#   # expect some 429 responses once the burst is exceeded
#
# Rollback:
#   sudo rm /etc/nginx/conf.d/rate-limit.conf && sudo nginx -t && sudo systemctl reload nginx

# General API traffic: ~10 requests/second per client IP, generous burst.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Admin/expensive endpoints (POST /api/outages/fetch, GET /api/outages/export/csv):
# 1 request per minute per client IP. These are protected by ADMIN_API_KEY in
# the app already; this zone is a second layer against abuse/DoS.
limit_req_zone $binary_remote_addr zone=api_admin:10m rate=1r/m;

# Optional: cap simultaneous connections per IP (helps against slow-loris style abuse).
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Return 429 (not the nginx default 503) when a limit is hit, so clients and
# monitoring can tell rate limiting apart from a real backend outage.
limit_req_status 429;
limit_conn_status 429;
