# Compression and caching for sevillasinluz.es and api.sevillasinluz.es, http context.
#
# Install as /etc/nginx/conf.d/sevillasinluz-performance.conf (conf.d is included inside
# `http {}` by the stock nginx.conf). It does not turn gzip on: Ubuntu's nginx.conf already
# has `gzip on;` but only compresses text/html; this file adds the types the site serves
# (JS, CSS, JSON from the API, GeoJSON, CSV). These gzip settings also apply to any other
# site on the server, which only makes their responses smaller.
#
# Cache-Control is chosen per URI by the map below and sent from the site's headers snippet:
#   add_header Cache-Control $sevillasinluz_cache_control always;
# An empty value means nginx sends no Cache-Control header at all.
#
# Verify:
#   curl -sI -H 'Accept-Encoding: gzip' https://api.sevillasinluz.es/api/outages/live | grep -i content-encoding
#   curl -sI https://sevillasinluz.es/ | grep -i cache-control        # no-cache
#   curl -sI https://sevillasinluz.es/boot.js | grep -i cache-control # no-cache
#
# Rollback: delete this file and the add_header line, `nginx -t && systemctl reload nginx`.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json
           application/geo+json image/svg+xml text/csv text/plain;

map $uri $sevillasinluz_cache_control {
    default                                   "";
    # Angular build output carries a content hash (main-ABCD1234.js, styles-ABCD1234.css):
    # a new build means a new file name, so these can be cached forever.
    "~^/[a-z]+-[A-Z0-9]{8}\.(js|css)$"        "public, max-age=31536000, immutable";
    # Entry points must always be revalidated so a deploy is picked up immediately.
    "/"                                       "no-cache";
    "/index.html"                             "no-cache";
    "/boot.js"                                "no-cache";
    # Static data and images change rarely but keep their names.
    "~^/geo/"                                 "public, max-age=86400";
    "~\.(jpg|jpeg|png|webp|svg|ico)$"         "public, max-age=86400";
}
