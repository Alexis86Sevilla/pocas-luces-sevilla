# Security headers for the api.sevillasinluz.es JSON API, server-block context.
#
# Include inside the HTTPS `server { }` block for api.sevillasinluz.es, AFTER the
# `listen 443 ssl;` and cert directives. CORS is intentionally NOT set here: it is
# handled in Spring (backend/src/main/java/com/pocasluces/backend/config/CorsConfig.java).
# Do not add Access-Control-* headers in nginx as well — that causes duplicate/
# conflicting CORS headers, which browsers reject.
#
# Install:
#   sudo cp infra/nginx/security-headers-api.conf /etc/nginx/snippets/security-headers-api.conf
#   # then add inside the api server{} block:  include snippets/security-headers-api.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -sI https://api.sevillasinluz.es/api/outages/live | grep -iE 'strict-transport|x-content-type|content-security-policy'
#
# Rollback:
#   remove the `include snippets/security-headers-api.conf;` line, nginx -t, reload.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;

# A JSON API is never framed; this also does not interfere with CORS (frame-ancestors
# is unrelated to Access-Control-Allow-Origin).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

server_tokens off;
