name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two deploys at once; a queued deploy waits instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: chmod +x mvnw && ./mvnw clean package

      - name: Stage JAR for upload
        run: mkdir -p target/deploy && cp target/backend-0.0.1-SNAPSHOT.jar target/deploy/backend-new.jar

      - name: Upload JAR to VPS (next to the running one)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/target/deploy/backend-new.jar"
          target: "/opt/sevillasinluz/"
          strip_components: 3
          overwrite: true

      # Swap the JAR, restart and wait for /api/health. On failure the previous JAR is restored.
      # Note: a Flyway migration already applied by the failed version is NOT rolled back.
      - name: Swap JAR, restart and verify (rollback on failure)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/sevillasinluz

            wait_healthy() {
              # curl -f succeeds only on 2xx, so any non-200 answer keeps polling.
              local deadline=$((SECONDS + 180))
              while [ "$SECONDS" -lt "$deadline" ]; do
                if curl -fsS --max-time 5 http://127.0.0.1:8081/api/health > /tmp/health.json 2>/dev/null; then
                  echo "Health OK: $(cat /tmp/health.json)"
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            if [ -f backend-0.0.1-SNAPSHOT.jar ]; then
              cp -p backend-0.0.1-SNAPSHOT.jar backend-previous.jar
            fi
            mv backend-new.jar backend-0.0.1-SNAPSHOT.jar
            systemctl restart sevillasinluz

            if wait_healthy; then
              echo "Backend deploy succeeded"
              exit 0
            fi

            echo "Backend did not become healthy within 180s; rolling back"
            journalctl -u sevillasinluz -n 80 --no-pager || true
            if [ -f backend-previous.jar ]; then
              cp -p backend-previous.jar backend-0.0.1-SNAPSHOT.jar
              systemctl restart sevillasinluz
              wait_healthy || echo "Previous version did not report healthy either"
            else
              echo "No previous JAR to restore"
            fi
            exit 1

      - name: Check public API health
        working-directory: .
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://api.sevillasinluz.es/api/health

  frontend:
    name: Build and deploy frontend
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec ng test --watch=false

      - name: Build production
        run: pnpm build

      - name: Prepare staging directory on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            rm -rf /var/www/sevillasinluz-staging
            mkdir -p /var/www/sevillasinluz-staging

      - name: Upload frontend to staging
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/frontend/browser/*"
          target: "/var/www/sevillasinluz-staging/"
          strip_components: 4
          overwrite: true

      # Hashed assets first, entry points (boot.js, index.html) last. Old hashed chunks are kept
      # because clients holding a cached index.html still need them.
      - name: Publish frontend (assets first, index.html last)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            test -f /var/www/sevillasinluz-staging/index.html
            cd /var/www/sevillasinluz-staging
            find . -type f ! -name index.html ! -name boot.js -exec cp --parents -p {} /var/www/sevillasinluz/ \;
            if [ -f boot.js ]; then cp -p boot.js /var/www/sevillasinluz/boot.js; fi
            cp -p index.html /var/www/sevillasinluz/index.html
            cd /
            rm -rf /var/www/sevillasinluz-staging

      - name: Verify live site and main bundle
        working-directory: .
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o index.html https://sevillasinluz.es/
          main=$(grep -oE 'main-[A-Za-z0-9_-]+\.js' index.html | head -n1)
          test -n "$main"
          echo "Live bundle: $main"
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null "https://sevillasinluz.es/$main"
