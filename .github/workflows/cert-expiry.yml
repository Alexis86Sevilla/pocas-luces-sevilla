name: TLS certificate expiry

# Free replacement for paid SSL-expiry alerts: fails when a certificate expires in fewer
# than MIN_DAYS days. GitHub emails the failure of a scheduled run to whoever last edited
# the schedule. Note: GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIN_DAYS: 20
      HOSTS: sevillasinluz.es www.sevillasinluz.es api.sevillasinluz.es
    steps:
      - name: Check days left per host
        run: |
          status=0
          for host in $HOSTS; do
            end=$(echo | timeout 15 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
            if [ -z "$end" ]; then
              echo "::error::$host: could not read the certificate"
              status=1
              continue
            fi
            days=$(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
            echo "$host: expires $end ($days days left)"
            if [ "$days" -lt "$MIN_DAYS" ]; then
              echo "::error::$host certificate expires in $days days; check certbot renewal on the VPS"
              status=1
            fi
          done
          exit $status
