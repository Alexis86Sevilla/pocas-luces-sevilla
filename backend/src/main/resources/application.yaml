spring:
  application:
    name: backend

  profiles:
    active: prod

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Europe/Madrid

  jpa:
    properties:
      hibernate:
        # Timezone contract (see README, "Timezone contract"): every LocalDateTime is
        # Europe/Madrid wall-clock and must reach the TIMESTAMP column verbatim, whatever
        # the JVM default zone is. With this flag Hibernate binds/reads java.time values
        # through JDBC 4.2 setObject/getObject instead of converting via java.sql.Timestamp
        # (which goes through the JVM default zone). Do NOT add hibernate.jdbc.time_zone:
        # combined with a non-Madrid JVM it shifted JPA reads/writes by the zone offset
        # while the native JDBC path did not (2026-09-29 incident).
        type:
          java_time_use_direct_jdbc: true

# Set via environment variable ADMIN_API_KEY or override in profile-specific config.
# Endpoints protected: POST /api/outages/fetch and GET /api/outages/export/csv
admin:
  api:
    key: ${ADMIN_API_KEY:}
  fetch:
    # Minimum time between manually triggered fetches via POST /api/outages/fetch.
    cooldown: 5m

# Public Telegram alerts (see README, "Telegram alerts"). Active only when BOTH are set;
# with either blank the feature is off and no HTTP call is ever made. The token is a secret
# and is never logged; the chat id (e.g. @SevillaSinLuz) is public.
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

# GET /api/health (public) is meant for external uptime monitors.
health:
  # 503 STALE when the last successful Endesa fetch is older than this (scheduler runs every 5m).
  max-fetch-age: 20m
  # After startup, report 200 STARTING (instead of 503 STALE) while no fetch has succeeded yet.
  startup-grace: 10m

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:pocasluces
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    com.pocasluces: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/sevillasinluz
    driver-class-name: org.postgresql.Driver
    username: sevillasinluz_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  sql:
    init:
      mode: never

server:
  port: 8081

logging:
  level:
    com.pocasluces: INFO
