<div class="inline-flex flex-col items-start gap-1">
  <div class="flex flex-wrap items-center gap-2">
    <a [href]="href()" download
      [attr.aria-label]="ariaLabel() ?? label()"
      class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      {{ label() }}
    </a>
    <a [href]="excelHref()" download
      [attr.aria-label]="excelAriaLabel() ?? excelLabel()"
      class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      {{ excelLabel() }}
    </a>
  </div>
  @if (showLicense()) {
    <p class="max-w-md text-xs leading-relaxed text-gray-500">
      Datos abiertos bajo licencia
      <a href="https://creativecommons.org/licenses/by/4.0/deed.es" target="_blank" rel="noopener noreferrer"
        class="font-medium text-amber-700 underline hover:text-amber-600">CC BY 4.0</a>.
      Cita: «Sevilla Sin Luz (sevillasinluz.es), a partir de datos públicos de e-distribución (Grupo Endesa)».
    </p>
  }
</div>
