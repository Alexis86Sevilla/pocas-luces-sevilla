<!-- The status floats under the button so it never shifts the surrounding row. -->
<div class="relative inline-flex">
  <button type="button" [class]="buttonClasses()" (click)="share()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg>
    Compartir
  </button>

  <div aria-live="polite" class="absolute left-0 top-full z-10 mt-1 whitespace-nowrap text-xs">
    @if (status() === 'copied') {
      <span [class]="statusTextClass()">Enlace copiado</span>
    } @else if (status() === 'manual') {
      <span [class]="manualTextClass()">
        Copia el enlace:
        <input type="text" readonly [value]="shareUrl()" [class]="manualInputClass()"
          aria-label="Enlace para compartir" (focus)="selectInput($event)" />
      </span>
    }
  </div>
</div>
