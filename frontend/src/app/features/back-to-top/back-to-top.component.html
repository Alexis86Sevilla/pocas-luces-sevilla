@if (visible()) {
  <div class="fixed bottom-6 right-6 z-30 flex flex-col items-center gap-3">
    <button type="button"
      class="cursor-pointer rounded-full bg-gray-900 p-3 text-white shadow-lg transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2"
      aria-label="Volver arriba"
      (click)="scrollToTop()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <a href="#apoyar"
      class="rounded-full bg-gray-900 p-3 text-rose-400 shadow-lg transition hover:bg-gray-700 hover:text-rose-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2"
      aria-label="Apoyar el proyecto"
      title="Apoyar el proyecto"
      (click)="scrollToSupport($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.3 2.4h1.8c.7-1.3 2.2-2.4 4.3-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    </a>
  </div>
}
