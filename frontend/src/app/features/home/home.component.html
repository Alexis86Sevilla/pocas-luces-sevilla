<main class="min-h-screen bg-gray-50">
  <app-hero />

  <div id="en-directo">
    <app-live-section [liveGroups]="liveGroups()" />
  </div>

  <section class="bg-white pt-20 pb-10">
    <div class="mx-auto max-w-6xl px-6">
      <app-monthly-section
        [districts]="districts()"
        [monthlyOutages]="monthlyOutages()"
        [selectedMonth]="selectedMonth()"
        [selectedYear]="selectedYear()"
        (filterChange)="onFilterChange($event)" />
    </div>
  </section>

  <section id="grafico-anual" class="bg-white pt-10 pb-20">
    <div class="mx-auto max-w-6xl px-6">
      <app-chart-section
        [districts]="districts()"
        [yearlyOutages]="yearlyOutages()" />
    </div>
  </section>
</main>
